[package]
name = "iced-av1"
version = "0.1.0"
edition = "2024"

[features]
default = []
opus = ["dep:opus-decoder", "dep:rodio", "dep:symphonia"]

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
futures-lite = "2.6.1"
glam = { version = "0.30.9", features = ["bytemuck"] }
iced = { version = "0.14.0", features = ["tokio", "svg"] }
iced_futures = "0.14.0"
itertools = "0.14.0"
matroska-demuxer = "0.7.0"
opus-decoder = { version = "0.1.1", optional = true }
re_rav1d = { version = "0.1.3", default-features = false, features = ["bitdepth_8"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"], optional = true }
symphonia = { version = "0.5.5", default-features = false, optional = true }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["sync"] }
tracing = "0.1.41"
